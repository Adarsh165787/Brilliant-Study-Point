services:
  - type: web
    name: brilliant-classes-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run start
    branch: main

  - type: static_site
    name: brilliant-classes-frontend
    env: node
    plan: free
    root: frontend
    buildCommand: npm install --include=dev && npm run build
    publishPath: dist
    branch: main
